name: temporary branch formatter
on:
  push:
    branches:
      - feature/grammar-capability-query-20260928
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format tracked Go sources and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd internal generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add cmd internal generated
            git commit -m "ci: format capability evidence changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git rm .github/workflows/temporary-branch-formatter.yml
          git commit -m "ci: remove temporary branch formatter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
