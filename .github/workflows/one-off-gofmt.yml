name: one-off branch formatter

on:
  push:
    branches:
      - feature/grammar-capability-query-20260928

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/grammar-capability-query-20260928'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/grammar-capability-query-20260928
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Go sources
        run: gofmt -w cmd internal generated
      - name: Commit formatted sources and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal generated
          git rm .github/workflows/one-off-gofmt.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply CI formatter to JSONL adapter"
          git push origin HEAD:feature/grammar-capability-query-20260928
