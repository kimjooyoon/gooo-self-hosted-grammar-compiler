name: one-off branch formatter

on:
  push:
    branches:
      - feature/grammar-capability-query-20260928

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grammar-capability-query-20260928
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          if [ -d generated ]; then
            gofmt -w cmd internal generated
          else
            gofmt -w cmd internal
          fi
          git rm .github/workflows/one-off-gofmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal generated 2>/dev/null || git add cmd internal
          git commit -m "chore: format capability discovery"
          git push origin HEAD:feature/grammar-capability-query-20260928